<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <title>業務管理</title>
  <?!= include('style_css') ?>
</head>
<body>
  <div id="app">
    <aside class="nav">
      <div class="brand">
        <div class="brand-name">ミライシステム株式会社（サンプル）</div>
        <div class="brand-sub">業務管理</div>
      </div>
      <nav>
        <button class="nav-item active" data-view="cases"><span class="ic">▤</span>案件一覧</button>
        <button class="nav-item" data-view="clients"><span class="ic">◎</span>取引先</button>
        <button class="nav-item" data-view="history"><span class="ic">✎</span>対応履歴</button>
      </nav>
      <div class="user">
        <div class="user-name" id="userName">…</div>
        <div class="user-role" id="userRole">…</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="viewTitle">案件一覧</h1>
        <div class="topbar-right">
          <span class="today" id="todayLabel"></span>
          <button class="btn primary hidden" id="btnNewCase">＋ 案件を登録</button>
          <button class="btn primary hidden" id="btnNewClient">＋ 取引先を登録</button>
        </div>
      </header>

      <!-- 案件一覧（TOP） -->
      <section class="view" id="view-cases">
        <div class="kpis" id="kpis"></div>

        <div class="toolbar">
          <div class="fgroup">
            <span class="flabel">担当者</span>
            <select id="fOwner"></select>
          </div>
          <div class="fgroup">
            <span class="flabel">ステータス</span>
            <div class="seg" id="fStatus"></div>
          </div>
          <div class="fgroup">
            <span class="flabel">期限</span>
            <button class="chip late" id="fLate" aria-pressed="false">期限切れ</button>
            <button class="chip soon" id="fSoon" aria-pressed="false">7日以内</button>
          </div>
          <div class="spacer"></div>
          <button class="btn ghost sm hidden" id="fClear">絞り込みを解除</button>
          <div class="fnote">ステータスの数字は、担当者と期限の絞り込みを当てた中の件数です</div>
        </div>

        <div class="board">
          <div class="card">
            <div class="card-head"><h2>案件</h2><span class="hint" id="caseCount"></span></div>
            <table class="tbl cases" id="tblCases">
              <thead><tr>
                <th class="col-due">期限</th><th>案件</th><th class="col-owner">担当者</th><th class="col-status">ステータス</th><th class="col-last">最新の対応</th>
              </tr></thead>
              <tbody></tbody>
            </table>
          </div>

          <div class="card feed">
            <div class="card-head"><h2>対応履歴</h2><span class="hint">新しい順</span></div>
            <ul class="feed-list" id="feed"></ul>
          </div>
        </div>
      </section>

      <!-- 案件の詳細 -->
      <section class="view hidden" id="view-case">
        <div class="case-head">
          <button class="btn ghost sm back" id="btnBack">← 案件一覧に戻る</button>
          <div class="case-title-row"><h2 id="cTitle"></h2><span id="cBadges"></span></div>
          <div class="case-sub" id="cSub"></div>
        </div>

        <div class="detail">
          <div class="card">
            <div class="card-head"><h2>基本情報</h2><button class="btn sm" id="btnEditCase">編集</button></div>
            <dl class="props">
              <dt>取引先</dt><dd id="cClient"></dd>
              <dt>担当者</dt><dd><div class="owner-line"><span class="who" id="cOwner"></span><button class="btn sm" id="btnHandover">担当者を変更</button></div></dd>
              <dt>ステータス</dt><dd><div class="seg status-seg" id="cStatus"></div></dd>
              <dt>期限</dt><dd id="cDue"></dd>
              <dt>内容</dt><dd class="note" id="cNote"></dd>
              <dt>登録</dt><dd class="muted" id="cCreated"></dd>
            </dl>
          </div>

          <div class="card">
            <div class="card-head"><h2>対応履歴</h2><span class="hint" id="cLogCount"></span></div>
            <div class="log-form">
              <div class="kinds" id="hKinds"></div>
              <textarea id="hText" rows="3" placeholder="対応した内容"></textarea>
              <div class="log-actions">
                <span class="inline-alert hidden" id="hAlert"></span>
                <button class="btn primary" id="btnAddLog">記録する</button>
              </div>
            </div>
            <ul class="timeline" id="cTimeline"></ul>
          </div>
        </div>
      </section>

      <!-- 取引先 -->
      <section class="view hidden" id="view-clients">
        <div class="card">
          <div class="card-head"><h2>取引先</h2><span class="hint" id="clientCount"></span></div>
          <table class="tbl" id="tblClients">
            <thead><tr><th>名称</th><th>先方担当者</th><th>電話</th><th>メール</th><th class="n">進行中の案件</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <!-- 対応履歴 -->
      <section class="view hidden" id="view-history">
        <div class="toolbar">
          <div class="fgroup">
            <span class="flabel">記入者</span>
            <select id="hBy"></select>
          </div>
          <div class="fgroup">
            <span class="flabel">種別</span>
            <select id="hKind"></select>
          </div>
        </div>
        <div class="card">
          <div class="card-head"><h2>対応履歴</h2><span class="hint" id="histCount"></span></div>
          <ul class="feed-list" id="histList"></ul>
        </div>
      </section>
    </main>
  </div>

  <div class="modal hidden" id="modal"><div class="modal-box" id="modalBox"></div></div>
  <div class="toast hidden" id="toast"></div>

  <?!= include('app_js') ?>
</body>
</html>
